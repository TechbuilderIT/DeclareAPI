entities:
  Users:
    endpoints:
      list:
        method: GET
        path: /users
        source:
          type: table
          name: users
        filters:
          - { field: email, operator: contains }
          - { field: first_name, operator: contains }
          - { field: last_name, operator: contains }
          - { field: cpf, operator: contains }
          - { field: email_verified, operator: equals }
          - { field: provider_id, operator: equals }
          - { field: user_type, operator: in }
          - { field: is_active, operator: equals }
        paginated: true
      get:
        method: GET
        path: /users/{id}
        source:
          type: table
          name: users
        params:
          - { name: id, type: uuid, from: route }
      create:
        method: POST
        path: /users
        source:
          type: table
          name: users
        fields:
          - { name: email, type: string, required: true, pattern: email }
          - { name: first_name, type: string }
          - { name: last_name, type: string }
          - { name: cpf, type: string, required: true }
          - { name: password_hash, type: string }
          - { name: email_verified, type: boolean, pattern: email }
          - { name: provider, type: string }
          - { name: provider_id, type: string }
          - { name: user_type, type: string }
          - { name: is_active, type: boolean }
          - { name: avatar_url, type: string }
          - { name: last_login, type: datetime }
        returns: uuid
      update:
        method: PUT
        path: /users/{id}
        source:
          type: table
          name: users
        params:
          - { name: id, type: uuid, from: route }
        fields:
          - { name: email, type: string, pattern: email }
          - { name: first_name, type: string }
          - { name: last_name, type: string }
          - { name: cpf, type: string }
          - { name: password_hash, type: string }
          - { name: email_verified, type: boolean, pattern: email }
          - { name: provider, type: string }
          - { name: provider_id, type: string }
          - { name: user_type, type: string }
          - { name: is_active, type: boolean }
          - { name: avatar_url, type: string }
          - { name: last_login, type: datetime }
