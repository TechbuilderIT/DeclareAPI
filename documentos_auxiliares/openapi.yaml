        '201':
          description: Grupo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Obter grupo por ID
      description: Retorna detalhes de um grupo específico.
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Grupo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Groups
      summary: Atualizar grupo
      description: |
        Atualiza um grupo existente. Requer permissão admin.
        - **RF-084**: Editar Grupo
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
      responses:
        '200':
          description: Grupo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Groups
      summary: Deletar grupo
      description: |
        Remove um grupo de ferramentas. Requer permissão admin.
        - **RF-084**: Deletar Grupo
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Grupo deletado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{id}/tools:
    post:
      tags:
        - Groups
      summary: Associar ferramentas ao grupo
      description: |
        Associa uma lista de ferramentas a um grupo. Requer admin.
        - **RF-085**: Associar Ferramentas a Grupos
      operationId: addToolsToGroup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toolIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - toolIds
      responses:
        '200':
          description: Ferramentas associadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # === USER ASSISTANT CUSTOMIZATION (Premium) ===

  /users/me/assistants/{assistantId}/customization:
    get:
      tags:
        - UserAssistantCustomization
      summary: Obter todas as personalizações do usuário para um assistente
      description: |
        Retorna todas as personalizações (ferramentas + template) do usuário logado
        para um assistente específico.

        **Requisitos:** RN-090 (Acesso a Personalização de Assistentes)

        **Apenas Premium:** Sim
      operationId: getUserAssistantCustomization
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      responses:
        '200':
          description: Personalizações do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAssistantCustomizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/assistants/{assistantId}/tool-preferences:
    get:
      tags:
        - UserAssistantCustomization
      summary: Obter preferências de ferramentas do usuário
      description: |
        Retorna as preferências de ferramentas do usuário logado para um assistente.
        Inclui todas as ferramentas do assistente com o status de ativação do usuário.

        **Requisitos:** RN-091 (Preferências de Ferramentas por Usuário)

        **Apenas Premium:** Sim
      operationId: getUserToolPreferences
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      responses:
        '200':
          description: Preferências de ferramentas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserToolPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - UserAssistantCustomization
      summary: Atualizar preferências de ferramentas
      description: |
        Atualiza as preferências de ferramentas do usuário logado para um assistente.
        Permite ativar/desativar ferramentas e reordenar sua exibição.

        **Requisitos:** RN-091 (Preferências de Ferramentas por Usuário)

        **Apenas Premium:** Sim
      operationId: updateUserToolPreferences
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserToolPreferencesRequest'
      responses:
        '200':
          description: Preferências atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserToolPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me/assistants/{assistantId}/template:
    get:
      tags:
        - UserAssistantCustomization
      summary: Obter template de saída personalizado
      description: |
        Retorna o template de saída personalizado do usuário para um assistente.
        Retorna null se o usuário não tem personalização (usa template padrão).

        **Requisitos:** RN-092 (Templates de Saída Personalizados)

        **Apenas Premium:** Sim
      operationId: getUserOutputTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      responses:
        '200':
          description: Template personalizado (ou null se usando padrão)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutputTemplate'
                nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - UserAssistantCustomization
      summary: Criar template de saída personalizado
      description: |
        Cria uma cópia personalizada do template de saída do assistente.
        Se já existe um template personalizado, ele será substituído.

        **Requisitos:** RN-092, RN-093 (Templates Personalizados)

        **Apenas Premium:** Sim
      operationId: createUserOutputTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserOutputTemplateRequest'
      responses:
        '201':
          description: Template personalizado criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutputTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - UserAssistantCustomization
      summary: Atualizar template de saída personalizado
      description: |
        Atualiza o template de saída personalizado do usuário.
        Permite editar nome, tabs e configurações de renderização.

        **Requisitos:** RN-092 (Templates de Saída Personalizados)

        **Apenas Premium:** Sim
      operationId: updateUserOutputTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserOutputTemplateRequest'
      responses:
        '200':
          description: Template atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutputTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template personalizado não encontrado (use POST para criar)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - UserAssistantCustomization
      summary: Restaurar template padrão
      description: |
        Remove o template personalizado do usuário, restaurando o template padrão do assistente.

        **Requisitos:** RN-094 (Restauração de Template Padrão)

        **Apenas Premium:** Sim
      operationId: deleteUserOutputTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: assistantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do assistente
      responses:
        '204':
          description: Template personalizado removido, usando padrão
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é Premium ou não tem acesso ao assistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template personalizado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

